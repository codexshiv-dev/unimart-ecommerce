<div class="modal-overlay" id="productModal">
  <div class="modal-card">
    <div class="modal-header">
      <h2 id="modalTitle">Add New Product</h2>
      <button class="modal-close-btn" id="closeFormBtn">&times;</button>
    </div>

    <form id="productForm" class="modal-form-grid">
      <input type="hidden" id="productId" />

      <div class="form-group full-width">
        <label for="pName">Product Name *</label>
        <input
          type="text"
          id="pName"
          placeholder="e.g., Astronaut Star Projector"
          oninput="
            if (typeof window.autoGenerateSKU === 'function')
              window.autoGenerateSKU();
          "
          required />
      </div>

      <div class="form-group">
        <label for="pSku">SKU Code *</label>
        <input
          type="text"
          id="pSku"
          placeholder="Auto-generating code..."
          style="
            background-color: #f1f5f9;
            color: #475569;
            cursor: not-allowed;
            font-family: monospace;
            font-weight: 600;
          "
          readonly
          required />
      </div>

      <div class="form-group">
        <label for="pCategory">Category *</label>
        <select
          id="pCategory"
          onchange="
            if (typeof window.autoGenerateSKU === 'function')
              window.autoGenerateSKU();
          "
          required>
          <option value="">Select Category</option>
        </select>
      </div>

      <div class="form-group">
        <label for="pPrice">Selling Price (₹) *</label>
        <input type="number" id="pPrice" min="0" placeholder="1500" required />
      </div>

      <div class="form-group">
        <label for="pOldPrice">Original/Old Price (₹)</label>
        <input type="number" id="pOldPrice" min="0" placeholder="2500" />
      </div>

      <div class="form-group">
        <label for="pStock">Stock Quantity *</label>
        <input type="number" id="pStock" min="0" placeholder="15" required />
      </div>

      <div class="form-group">
        <label for="pStatus">Status</label>
        <select id="pStatus" required>
          <option value="active">Active</option>
          <option value="inactive">Inactive</option>
        </select>
      </div>
      <div class="form-group full-width">
        <label class="gallery-label"
          >Product Images <span class="max-note">(Max 4 files)</span></label
        >

        <div class="premium-gallery-container">
          <div class="gallery-dropzone" id="galleryDropzone">
            <div class="dropzone-prompt">
              <span class="upload-icon">📸</span>
              <p>
                Drag & drop product images here or
                <span class="browse-link">browse files</span>
              </p>
              <span class="file-spec-info"
                >Supports JPEG, PNG, WEBP (Max 2MB per image)</span
              >
            </div>
            <input
              type="file"
              id="hiddenGalleryInput"
              accept="image/*"
              multiple
              style="display: none" />
          </div>

          <div class="url-input-bar">
            <input
              type="url"
              id="pMediaUrlInput"
              placeholder="Or paste an image web URL here..." />
            <button type="button" id="addUrlMediaBtn" class="btn-secondary-sm">
              Add URL
            </button>
          </div>

          <div
            class="gallery-preview-wrapper"
            id="galleryPreviewWrapper"
            style="display: none">
            <div class="main-preview-hero">
              <img id="galleryHeroDisplay" src="" alt="Primary Hero Preview" />
              <span class="hero-badge">Primary Cover</span>
            </div>
            <div class="thumbnail-strip-grid" id="thumbnailStripGrid"></div>
          </div>
        </div>
      </div>

      <div class="form-group full-width">
        <label for="pTags"
          >Tags
          <span class="max-note">(Press Enter or Comma to add)</span></label
        >
        <div
          class="tags-input-wrapper-card"
          id="tagsWrapperCard"
          style="
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding: 6px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: #fff;
            min-height: 38px;
            align-items: center;
          ">
          <div
            id="tagsPillsContainer"
            style="display: flex; flex-wrap: wrap; gap: 4px"></div>
          <input
            type="text"
            id="pTags"
            placeholder="e.g., galaxy, led, bedroom"
            style="
              border: none;
              outline: none;
              flex: 1;
              min-width: 120px;
              padding: 4px;
              margin: 0;
            " />
        </div>
      </div>

      <div class="form-group">
        <label for="pRating">Initial Rating (0-5)</label>
        <input
          type="number"
          id="pRating"
          min="1"
          max="5"
          step="0.1"
          placeholder="4.8" />
      </div>

      <div class="form-group full-width">
        <label for="pDescription">Product Description</label>
        <textarea
          id="pDescription"
          rows="3"
          placeholder="Describe features, metrics, inclusions..."></textarea>
      </div>

      <div class="form-group full-width checkbox-card">
        <span class="section-micro-label">Product Badges</span>
        <div class="checkbox-row">
          <label><input type="checkbox" id="pIsFeatured" /> Featured</label>
          <label><input type="checkbox" id="pIsNew" checked /> New</label>
          <label
            ><input type="checkbox" id="pIsBestSeller" /> Best Seller</label
          >
        </div>
      </div>

      <div class="modal-actions full-width">
        <button type="button" class="btn-secondary" id="cancelFormBtn">
          Cancel
        </button>
        <button type="submit" class="btn-primary" id="saveProductBtn">
          Save Product
        </button>
      </div>
    </form>
  </div>
</div>

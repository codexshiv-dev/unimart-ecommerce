<div id="global-toast-container" class="toast-notification-container"></div>

<div id="customConfirmModal" class="confirm-backdrop-overlay">
  <div class="confirm-dialog-card">
    <div id="confirmModalIcon" class="confirm-graphic-icon">⚠️</div>
    <div class="confirm-content-block">
      <h3 id="confirmModalTitle">Erase Record?</h3>
      <p id="confirmModalDescription">Are you absolutely certain you want to proceed with executing this state mutation action chain?</p>
    </div>
    <div class="confirm-actions-row">
      <button id="confirmCancelBtn" class="confirm-btn btn-secondary-dim">Cancel</button>
      <button id="confirmProceedBtn" class="confirm-btn btn-danger-action">Proceed</button>
    </div>
  </div>
</div>

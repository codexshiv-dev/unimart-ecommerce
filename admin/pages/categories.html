<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Categories - UniMart Admin</title>

    <link rel="stylesheet" href="../css/variables.css" />
    <link rel="stylesheet" href="../css/layout.css" />
    <link rel="stylesheet" href="../css/sidebar.css" />
    <link rel="stylesheet" href="../css/navbar.css" />
    <link rel="stylesheet" href="../css/products.css" />
    <link rel="stylesheet" href="../css/categories.css" />
  </head>
  <body>
    <div class="admin-layout">
      <div id="sidebar-container"></div>
      <div id="sidebarOverlay"></div>
      <div id="shared-ui-layer-container"></div>

      <div class="main-wrapper">
        <div id="header-container"></div>

        <main class="page-content">
          <section class="page-header">
            <div class="header-title-block">
              <h1>Taxonomy Categories</h1>
              <p>
                Manage dynamic storefront product collection classifications
                safely.
              </p>
            </div>
          </section>

          <div class="categories-view-grid">
            <div class="control-form-card">
              <h3>➕ Add New Category</h3>
              <form id="categoryManagementForm">
                <div class="form-input-group">
                  <label for="catInputName">Category Display Name *</label>
                  <input
                    type="text"
                    id="catInputName"
                    placeholder="e.g., Home Decor, Gadgets"
                    required
                    autocomplete="off" />
                </div>

                <div class="form-input-group">
                  <label for="catInputIcon">
                    Visual Emoji Icon *
                    <span
                      style="
                        font-size: 11px;
                        color: #94a3b8;
                        font-weight: normal;
                      ">
                      (Press Win + . or Cmd + Ctrl + Space)
                    </span>
                  </label>
                  <input
                    type="text"
                    id="catInputIcon"
                    placeholder="Paste a single emoji (e.g., ⚡, 🧸, 🎮)"
                    required
                    autocomplete="off" />
                </div>

                <button type="submit" class="btn-primary form-submit-btn">
                  Create Category
                </button>
              </form>
            </div>

            <div class="table-card">
              <table class="products-table">
                <thead>
                  <tr>
                    <th style="width: 65px">#</th>
                    <th style="width: 85px">Icon</th>
                    <th>Category Name</th>
                    <th>System Slug ID</th>
                    <th
                      style="
                        text-align: right;
                        width: 120px;
                        padding-right: 24px;
                      ">
                      Actions
                    </th>
                  </tr>
                </thead>
                <tbody id="categorySettingsTableBody"></tbody>
              </table>
            </div>
          </div>
        </main>
      </div>
    </div>

    <script src="../js/ui.js"></script>
    <script src="../js/layout.js"></script>
    <script src="../js/categories.js"></script>

    <script>
      // 🛡️ SECURITY LAYER: Escape dynamic user strings to prevent script injection exploits
      function sanitizeHTML(str) {
        if (!str) return "";
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function renderCategorySettingsTable() {
        const tbody = document.getElementById("categorySettingsTableBody");
        if (!tbody) return;

        tbody.innerHTML = "";

        // 1. Render empty states if no categories exist
        if (!window.categories || window.categories.length === 0) {
          tbody.innerHTML = `
            <tr>
              <td colspan="5" style="text-align: center; padding: 40px; color: #94a3b8; font-weight: 500;">
                <div style="font-size: 28px; margin-bottom: 8px;">📁</div>
                No categories available. Add a new classification on the left to get started!
              </td>
            </tr>`;
          return;
        }

        // 2. Build and mount grid data safely using high-performance fragments
        const fragment = document.createDocumentFragment();

        window.categories.forEach((cat, index) => {
          const tr = document.createElement("tr");

          tr.innerHTML = `
            <td class="serial-number-column">${index + 1}</td>
            <td class="category-emoji-preview">${sanitizeHTML(cat.icon)}</td>
            <td><span class="category-row-title">${sanitizeHTML(cat.name)}</span></td>
            <td><code class="category-slug-string">${sanitizeHTML(cat.slug)}</code></td>
            <td style="text-align: right; padding-right: 24px;">
              <div class="action-btn-container" style="justify-content: flex-end;">
                <button class="action-btn delete-trigger" title="Delete Category">🗑️</button>
              </div>
            </td>
          `;

          // Securely attach the click event listener to avoid global string execution context dependencies
          tr.querySelector(".delete-trigger").onclick = () =>
            handleCategoryDeletion(cat.id);
          fragment.appendChild(tr);
        });

        tbody.appendChild(fragment);
      }

      // ✨ ASYNC WORKFLOW FIX: Handle data validation threads cleanly using a proper async wrapper
      async function handleCategoryDeletion(id) {
        if (typeof window.deleteCategory === "function") {
          const result = await window.deleteCategory(id);
          if (result && result.success) {
            renderCategorySettingsTable();
          }
        }
      }

      // Form submission orchestration pipeline
      document
        .getElementById("categoryManagementForm")
        ?.addEventListener("submit", function (e) {
          e.preventDefault();
          const nameField = document.getElementById("catInputName");
          const iconField = document.getElementById("catInputIcon");

          if (!nameField || !iconField) return;

          if (typeof window.addCategory === "function") {
            const response = window.addCategory(
              nameField.value,
              iconField.value,
            );
            if (response.success) {
              nameField.value = "";
              iconField.value = "";
              renderCategorySettingsTable();
            }
          }
        });

      // Bind the layout function globally so categories.js can easily trigger table repaints on mutation updates
      window.renderCategorySettingsTable = renderCategorySettingsTable;

      // Safe lifecycle entry point orchestrator
      if (document.readyState === "loading") {
        document.addEventListener(
          "DOMContentLoaded",
          renderCategorySettingsTable,
        );
      } else {
        renderCategorySettingsTable();
      }
      window.addEventListener("load", renderCategorySettingsTable);
    </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — UNiMART</title>
  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/login.css" />
</head>
<body class="admin-login-page">
  <main class="admin-login-card">
    <div class="admin-login-brand">
      <span class="admin-login-brand-mark" aria-hidden="true">U</span>
      <span class="admin-login-brand-name">UNiMART Admin</span>
    </div>
    <h1>Welcome back</h1>
    <p>Sign in with your admin account to continue</p>

    <div class="admin-login-alert hidden" id="loginAlert" role="alert"></div>

    <form id="loginForm" novalidate>
      <div class="admin-field">
        <label for="email">Email</label>
        <input class="admin-input" type="email" id="email" name="email" autocomplete="username" required />
        <span class="admin-error-text hidden" id="emailError"></span>
      </div>
      <div class="admin-field">
        <label for="password">Password</label>
        <input class="admin-input" type="password" id="password" name="password" autocomplete="current-password" required />
        <span class="admin-error-text hidden" id="passwordError"></span>
      </div>

      <button class="admin-btn admin-btn--primary admin-login-submit" type="submit" id="loginSubmitBtn">
        <span id="loginSubmitText">Sign in</span>
      </button>
    </form>

    <p class="admin-login-footnote">Access is restricted to UNiMART administrators.</p>
  </main>

  <div id="toastContainer" aria-live="polite"></div>

  <script src="../js/config.js"></script>
  <script src="../js/services/apiClient.js"></script>
  <script src="../js/services/authService.js"></script>
  <script src="../js/state/authState.js"></script>
  <script src="../js/utils/toast.js"></script>
  <script src="../js/pages/login.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UniMart Admin Dashboard</title>

    <link rel="stylesheet" href="../css/variables.css" />
    <link rel="stylesheet" href="../css/layout.css" />
    <link rel="stylesheet" href="../css/sidebar.css" />
    <link rel="stylesheet" href="../css/navbar.css" />
    <link rel="stylesheet" href="../css/dashboard.css" />
    <link rel="stylesheet" href="../css/products.css" />

    <style>
      /* Prevent table layout popping issues when sticky headers render asynchronously */
      .recent-orders th {
        background: var(--neutral-light, #ffffff);
        position: sticky;
        top: 0;
        z-index: 2;
      }
      /* Ensure scrollbars look professional inside layout containers */
      .dashboard-scroll-viewport::-webkit-scrollbar {
        width: 6px;
      }
      .dashboard-scroll-viewport::-webkit-scrollbar-track {
        background: #f1f5f9;
        border-radius: 4px;
      }
      .dashboard-scroll-viewport::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
      }
    </style>
  </head>

  <body>
    <div class="admin-layout">
      <div id="sidebar-container"></div>
      <div id="sidebarOverlay"></div>
      <div id="shared-ui-layer-container"></div>

      <div class="main-wrapper">
        <div id="header-container"></div>

        <main class="page-content">
          <section class="dashboard-cards">
            <div class="kpi-card products">
              <h4>Total Products</h4>
              <h2 id="kpiTotalProducts">0</h2>
            </div>

            <div class="kpi-card orders">
              <h4>Total Orders</h4>
              <h2 id="kpiTotalOrders">0</h2>
            </div>

            <div class="kpi-card revenue">
              <h4>Total Revenue</h4>
              <h2 id="kpiTotalRevenue">₹0</h2>
            </div>

            <div class="kpi-card customers">
              <h4>Total Customers</h4>
              <h2 id="kpiTotalCustomers">0</h2>
            </div>
          </section>

          <section class="dashboard-grid">
            <div class="dashboard-card">
              <div class="card-header">
                <h3>Recent Orders</h3>
              </div>
              <div
                class="dashboard-scroll-viewport"
                style="max-height: 280px; overflow-y: auto; position: relative">
                <table
                  class="recent-orders"
                  style="width: 100%; border-collapse: collapse">
                  <thead>
                    <tr>
                      <th style="text-align: left; padding: 12px 8px">ID</th>
                      <th style="text-align: left; padding: 12px 8px">
                        Customer
                      </th>
                      <th style="text-align: left; padding: 12px 8px">
                        Amount
                      </th>
                      <th style="text-align: left; padding: 12px 8px">
                        Status
                      </th>
                    </tr>
                  </thead>
                  <tbody id="recentOrdersTableBody"></tbody>
                </table>
              </div>
            </div>

            <div class="dashboard-card">
              <div class="card-header">
                <h3>Low Stock Products</h3>
              </div>
              <div
                id="lowStockContainerList"
                class="low-stock-list"
                style="max-height: 280px; overflow-y: auto"></div>
            </div>
          </section>
        </main>
      </div>
    </div>

    <script src="../js/ui.js"></script>
    <script src="../js/layout.js"></script>

    <script src="../js/categories.js"></script>
    <script src="../js/products.js"></script>

    <script src="../js/dashboard.js"></script>
  </body>
</html>
